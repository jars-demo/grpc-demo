name: Improvement or new exercise
description: Suggest a clearer explanation, a new failure scenario, or a fix to the content.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Learning goal
      description: What should a learner understand or be able to do afterwards?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it would work. For failure scenarios, how the failure is produced for real (not simulated).
    validations: { required: true }
